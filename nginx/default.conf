server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx sirve la app (SPA): cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets estaticos con cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|json|wasm|map)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No cachear el service worker ni el index
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
